# Build fix: Testing Render builds
# Render.com Infrastructure as Code
# Cost: $0/month (Free tier)
# Note: Free web services spin down after 15 min inactivity
# Note: Backend requires MongoDB - use MongoDB Atlas free tier (M0)

services:
  # Frontend - React/Vite Static Site (FREE)
  - type: web
    name: job-harmony-site
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # Backend - Express/TypeScript API (FREE)
  - type: web
    name: job-harmony-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        sync: false
      - key: SECRET_OR_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
